# This chart was originally developed by @MAVRICK-1
# Source: https://github.com/MAVRICK-1/kubestellar-ui

replicaCount: 1

frontend:
  image: mavrick1/kubestellar-f:latest
  port: 80

backend:
  image: mavrick1/kubestellar-b:latest
  port: 4000

# Ingress configuration
ingress:
  enabled: false  # Disabled by default to avoid webhook issues
  className: ""   # Set to "nginx" if you have nginx ingress controller
  host: frontend.local
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"

# Redis configuration for dependent chart
redis:
  enabled: true
  auth:
    enabled: false
  architecture: standalone
  master:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  replica:
    replicaCount: 0

kubeConfig: ""

# Container/chart image versions, please do not change them unless you know what you are doing.
KUBECTL_VERSION: "1.31.0"
